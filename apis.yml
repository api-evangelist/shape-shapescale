name: Shape Shapescale
description: >-
  Shapescale is a consumer body-scanning company that builds ShapeScale, a home
  3D body scanner and companion mobile app. The device slowly rotates around a
  standing user, captures a photorealistic 3D model of the body, and measures
  body composition, weight, and circumference metrics so users can track fitness
  and body changes over time. Shapescale is a Y Combinator portfolio company. As
  of this enrichment pass the company publishes a consumer product website but no
  public developer program, API reference, or machine-readable API artifacts.
